name: Build installable debug APK

# The upstream APK job runs on a self-hosted runner and needs organisation secrets, so it is
# skipped in this fork and nobody has ever produced an installable artifact from this branch.
# Everything CI proved so far was compilation; assembling an APK additionally exercises manifest
# merging, resource linking, asset packaging and signing, which is where a build of this shape
# actually tends to break.
#
# This job is deliberately self-contained: the free ubuntu-latest runner, the debug keystore the
# Android plugin generates, and a non-secret google-services.json copied from the one debug.yml
# already uses for verification.

on:
  push:
    branches:
      - arena/01a0cae9-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble v8 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      # The build downloads ~2.6 GB of external assets on top of the SDK and NDK, and the hosted
      # runner ships with roughly 25 GB free. Reclaiming the preinstalled toolchains this build
      # never touches buys the headroom cheaply.
      - name: Reclaim runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/ghc /usr/local/.ghcup /usr/local/share/powershell \
            /usr/share/swift /usr/local/share/chromium || true
          sudo apt-get clean || true
          echo "after:"; df -h / | tail -1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install the NDK and CMake the app configuration requires
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'ndk;29.0.14206865' 'cmake;3.22.1'

      # Same non-secret placeholder debug.yml uses. The google-services plugin refuses to configure
      # without this file, but a debug build never contacts Firebase, so real credentials are not
      # needed to prove the APK assembles.
      - name: Create non-secret google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "local-verification",
              "storage_bucket": "local-verification.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0000000000000000",
                "android_client_info": {"package_name": "com.itsaky.androidide"}
              },
              "api_key": [{"current_key": "not-a-secret"}]
            }],
            "configuration_version": "1"
          }
          JSON

      # AGP generates ~/.android/debug.keystore itself when it is missing, but that code path calls
      # into a BouncyCastle class (asn1.edec.EdECObjectIdentifiers) that is not on the runtime
      # classpath here, so validateSigningV8Debug dies with NoClassDefFoundError. Creating the
      # keystore up front with keytool avoids the generator entirely. The values are the ones AGP
      # itself uses, so the result is an ordinary debug keystore.
      # ANDROID_SDK_HOME is pinned because that, not $HOME, is what AGP resolves the default debug
      # keystore against; the previous attempt created the file in ~/.android and AGP still went
      # looking elsewhere and fell back into its generator.
      - name: Pre-create the Android debug keystore
        env:
          ANDROID_SDK_HOME: ${{ github.workspace }}
        run: |
          echo "ANDROID_SDK_HOME=${{ github.workspace }}" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.android" "$HOME/.android"
          for dir in "${{ github.workspace }}/.android" "$HOME/.android"; do
          if [ ! -f "$dir/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$dir/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          done
          ls -la "${{ github.workspace }}/.android" "$HOME/.android"

      - name: Install advancecomp (advzip, used by recompressApk)
        run: |
          command -v advzip || { sudo apt-get update && sudo apt-get install -y advancecomp; }

      # v8 is the arm64-v8a flavor, which is what a modern phone needs. Not using the flox wrapper
      # here: flox provides the toolchain on the self-hosted runner, whereas this job installs the
      # JDK and SDK itself through the setup actions above.
      # gradle.properties asks for -Xmx8g for Gradle *and* -Xmx8g for the Kotlin daemon with
      # workers.max=30. That suits a workstation; this runner has ~7 GB total, so the two heaps
      # alone oversubscribe it and the build died with OutOfMemoryError in compileV8DebugKotlin.
      # An earlier run only survived because more of the graph came from the cache. Overridden on
      # the command line rather than in gradle.properties so developer machines keep the large
      # heaps. The add-opens flags are carried over because Gradle replaces jvmargs wholesale.
      - name: Assemble the APK
        id: assemble
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew :app:assembleV8Debug \
            --no-daemon --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1g --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED" \
            -Dkotlin.daemon.jvmargs="-Xmx2048m" \
            -Dorg.gradle.parallel=false \
            2>&1 | tee assemble.log

      # Emitted as ::error:: annotations, not just into the summary: both the raw log and
      # artifacts are served from a storage domain that is not reachable everywhere, whereas
      # annotations come back through the REST API.
      - name: Report the failure
        if: failure() && steps.assemble.outcome == 'failure'
        run: |
          python3 - assemble.log <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith(('e: ', 'error: ', 'FAILURE', 'Caused by',
                                                    '* What went wrong', '* Try', 'Execution failed'))]
          tail = [l for l in lines if not l.startswith(('w: ', 'warning: '))][-80:]
          text = '\n'.join(keep[-60:] + ['--- tail ---'] + tail)
          for i in range(0, len(text), 3000):
              chunk = text[i:i + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Assemble failure (part {i // 3000 + 1})::{chunk}')
          PY
          {
            echo '## Assemble failed'
            echo '```text'
            tail -n 150 assemble.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The raw job log is served from a storage domain that is not reachable everywhere, so the
      # log is also published as an artifact, which downloads through the API.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assemble-log
          path: assemble.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate and describe the APK
        id: find_apk
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' -path '*v8*' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK produced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "APK_PATH=$apk" >> "$GITHUB_OUTPUT"
          size=$(stat -c '%s' "$apk")
          {
            echo '## APK built'
            echo ''
            echo "| field | value |"
            echo "|---|---|"
            echo "| file | \`$(basename "$apk")\` |"
            echo "| size | $(numfmt --to=iec "$size") |"
            echo "| sha256 | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the artifact is a well-formed, signed, installable package rather than just a file
      # that exists: aapt2 reads the merged manifest back out, and apksigner verifies the v2/v3
      # signature the debug config enables.
      - name: Verify the APK is well formed and signed
        run: |
          BT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"
          APK="${{ steps.find_apk.outputs.APK_PATH }}"
          "$BT/aapt2" dump badging "$APK" | head -20 | tee badging.txt
          "$BT/apksigner" verify --print-certs "$APK" && echo "signature OK"
          {
            echo ''
            echo '### Manifest as built'
            echo '```text'
            grep -E "package:|sdkVersion|targetSdkVersion|native-code|application-label" badging.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also as a notice: the step summary is not retrievable through the REST API, and these
          # facts - ABI, min/target SDK, signature - are exactly what has to be confirmed before
          # telling someone the artifact is safe to install.
          # head -20 earlier truncated badging before sdkVersion/native-code, so re-read the full
          # dump here rather than the trimmed copy.
          "$BT/aapt2" dump badging "$APK" > badging-full.txt
          facts=$(grep -E "^(package:|sdkVersion|targetSdkVersion|native-code|application-label:)" badging-full.txt | tr '\n' '; ')
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          size=$(stat -c '%s' "$APK")
          echo "::notice title=APK facts::$(basename "$APK") | $(numfmt --to=iec "$size") | sha256=$sha | $facts"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cogo-v8-debug-apk
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      # A debug build resolves USE_BUNDLED_ASSETS to false, so it installs through
      # SplitAssetsInstaller, which reads Download/assets-<arch>.zip off the device rather than
      # reading assets bundled in the APK. Without that file the setup screen fails on Finish with
      # "Missing installation files", which is what a tester actually hits. The APK alone is
      # therefore not a usable deliverable; this builds its companion payload.
      #
      # assembleV8Assets only depends on assetsDownloadDebug when not on CI, so the download is
      # requested explicitly here.
      # The APK is already uploaded by this point, so the intermediate build tree can go; the
      # payload needs ~1.2 GB of downloads plus ~1.2 GB for the zip it writes.
      - name: Free disk before the payload build
        run: |
          df -h / | tail -1
          rm -rf app/build/intermediates || true
          df -h / | tail -1

      # The asset host sits behind Cloudflare and refuses requests from this job intermittently:
      # a given file 404s on one attempt and returns 206 seconds later, and across runs the
      # casualty moved from android-sdk-arm64-v8a.zip to core.cgt. DownloadUtils has no retry, so
      # any single blip fails the task.
      #
      # Fetching with curl first, with per-file retries and backoff, then verifying each file
      # against the digest pinned in the manifest. assetsDownloadDebug skips any destination that
      # already matches its expected size and SHA-256, so Gradle then does no network I/O at all.
      # Verification is still fail-closed - a file that does not match its pinned digest is
      # deleted rather than handed to the build.
      - name: Prefetch the debug assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys, time

          assets = [a for a in json.load(open('config/assets-manifest.json'))['assets']
                    if a.get('variant') == 'debug']

          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as fh:
                  for block in iter(lambda: fh.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()

          failed = []
          for a in assets:
              dest, url = a['localPath'], a['url']
              os.makedirs(os.path.dirname(dest) or '.', exist_ok=True)

              if os.path.exists(dest) and os.path.getsize(dest) == a['size'] \
                      and digest(dest) == a['sha256']:
                  print(f"cached   {a['id']}")
                  continue

              for attempt in range(1, 6):
                  # --retry covers curl's own transient view of things; the outer loop covers a
                  # 404 from Cloudflare, which curl does not consider retryable.
                  r = subprocess.run(
                      ['curl', '-sSL', '--fail', '--max-time', '900',
                       '--retry', '3', '--retry-delay', '5', '--retry-all-errors',
                       '-o', dest, url])
                  if r.returncode == 0 and os.path.exists(dest) \
                          and os.path.getsize(dest) == a['size']:
                      got = digest(dest)
                      if got == a['sha256']:
                          print(f"ok       {a['id']} ({a['size'] / 1e6:.1f} MB)")
                          break
                      print(f"digest mismatch for {a['id']}: {got} != {a['sha256']}")
                      os.remove(dest)
                  elif os.path.exists(dest):
                      os.remove(dest)
                  wait = 10 * attempt
                  print(f"attempt {attempt} failed for {a['id']}, waiting {wait}s")
                  time.sleep(wait)
              else:
                  failed.append(a['id'])

          if failed:
              msg = 'could not fetch: ' + ', '.join(failed)
              print(f'::error title=Asset prefetch::{msg}')
              sys.exit(1)
          print('all debug assets present and verified')
          PY

      - name: Build the companion assets payload
        id: assets
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew :app:assetsDownloadDebug :app:assembleV8Assets \
            --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3584m -XX:MaxMetaspaceSize=1g --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED" \
            -Dorg.gradle.parallel=false \
            2>&1 | tee assets.log

      - name: Report an assets payload failure
        if: failure() && steps.assets.outcome == 'failure'
        run: |
          df -h / | tail -2
          url=https://appdevforall.org/dev-assets/debug/android-sdk-arm64-v8a.zip
          code=$(curl -sSL --max-time 60 -r 0-1023 -o /dev/null -w '%{http_code}' "$url" || echo 000)
          echo "::notice title=Post-failure sample::ranged GET right after the failure = $code"
          ls -la assets 2>/dev/null | head -30 || true
          python3 - assets.log <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          keep = [l for l in lines if l.startswith(('e: ', 'error: ', 'FAILURE', 'Caused by',
                                                    '* What went wrong', 'Execution failed'))]
          tail = [l for l in lines if not l.startswith(('w: ', 'warning: '))][-60:]
          text = '\n'.join(keep[-40:] + ['--- tail ---'] + tail)
          for i in range(0, len(text), 3000):
              chunk = text[i:i + 3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Assets payload failure (part {i // 3000 + 1})::{chunk}')
          PY

      - name: Describe the assets payload
        id: find_assets
        run: |
          zip=$(find app/build/outputs/assets -name 'assets-arm64-v8a.zip' | head -n 1)
          if [ -z "$zip" ]; then
            echo "::error title=Assets payload::assets-arm64-v8a.zip was not produced"
            exit 1
          fi
          echo "ASSETS_PATH=$zip" >> "$GITHUB_OUTPUT"
          size=$(stat -c '%s' "$zip")
          sha=$(sha256sum "$zip" | cut -d' ' -f1)
          echo "::notice title=Assets payload::$(basename "$zip") | $(numfmt --to=iec "$size") | sha256=$sha"
          {
            echo ''
            echo "### Companion assets payload"
            echo ''
            echo "| field | value |"
            echo "|---|---|"
            echo "| file | \`$(basename "$zip")\` |"
            echo "| size | $(numfmt --to=iec "$size") |"
            echo "| sha256 | \`$sha\` |"
            echo ''
            echo "Copy this file to the device at \`Download/assets-arm64-v8a.zip\` before"
            echo "pressing Finish on the setup screen."
          } >> "$GITHUB_STEP_SUMMARY"

      # The last deliverable failed on the device because its install path was never exercised.
      # createAssetsZip and AssetsInstallationHelper.expectedEntries agree only by convention, so
      # this asserts against the real archive: every entry the installer opens must be present and
      # non-empty, under the exact name it asks for. A rename on either side fails the build here
      # rather than on someone's phone.
      - name: Verify the payload carries every entry the installer opens
        run: |
          python3 - "${{ steps.find_assets.outputs.ASSETS_PATH }}" <<'PY'
          import re, sys, zipfile

          consts = open('composite-builds/build-deps-common/constants/src/main/java'
                        '/org/adfa/constants/constants.kt').read()

          def const(name):
              m = re.search(r'const val %s = "([^"]*)"' % name, consts)
              if not m:
                  sys.exit(f'constant {name} not found')
              v = m.group(1)
              # resolve simple ${OTHER} interpolations
              return re.sub(r'\$\{?(\w+)\}?', lambda g: const(g.group(1)), v)

          required = {
              'gradle distribution': const('GRADLE_DISTRIBUTION_ARCHIVE_NAME'),
              'android sdk':         const('ANDROID_SDK_ZIP'),
              'documentation db':    const('DOCUMENTATION_DB'),
              'local maven repo':    const('LOCAL_MAVEN_REPO_ARCHIVE_ZIP_NAME'),
              'gradle api':          const('GRADLE_API_NAME_JAR_ZIP'),
              'template core':       const('TEMPLATE_CORE_ARCHIVE'),
              # literals in AssetsInstallationHelper rather than the constants module
              'bootstrap':           'bootstrap.zip',
              'plugin artifacts':    'plugin-artifacts.zip',
          }

          with zipfile.ZipFile(sys.argv[1]) as z:
              present = {i.filename: i.file_size for i in z.infolist()}

          missing = {k: v for k, v in required.items()
                     if v not in present or present[v] == 0}

          width = max(len(v) for v in required.values())
          for label, name in sorted(required.items(), key=lambda kv: kv[1]):
              size = present.get(name)
              state = 'MISSING' if size is None else ('EMPTY' if size == 0
                                                      else f'{size / 1e6:.1f} MB')
              print(f'{name:<{width}}  {state:>10}   ({label})')

          extra = sorted(set(present) - set(required.values()))
          if extra:
              print('\nalso present (not required):',
                    ', '.join(f'{e} [{present[e] / 1e6:.1f} MB]' for e in extra))

          if missing:
              detail = ', '.join(f'{k} -> {v}' for k, v in missing.items())
              print(f'::error title=Payload incomplete::missing or empty: {detail}')
              sys.exit(1)
          print(f'\nAll {len(required)} installer entries present and non-empty.')
          PY

      - name: Upload the assets payload
        uses: actions/upload-artifact@v4
        with:
          name: cogo-v8-assets-payload
          path: ${{ steps.find_assets.outputs.ASSETS_PATH }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
